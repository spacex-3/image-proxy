name: Test reference image Worker
on:
  push:
    branches: [main]
    paths:
      - 'reference-worker/**'
      - '.github/workflows/test-reference-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test reference-worker/worker.test.mjs
